title: Plenty
description: "Plenty is Carmine Paolino's software company. It makes AI products, Ruby frameworks, developer tools, native desktop apps, Linux desktop tools, and DJ software."
url: "https://plenty.is"
baseurl: ""
lang: en
og_locale: "en_US"
twitter_site: "@paolino"
twitter_card: "summary_large_image"
social_image: "/assets/images/plenty-og.png"
social_image_width: 1200
social_image_height: 630
social_image_alt: "Plenty. Good enough isn’t Plenty. Software by Carmine Paolino."
logo: "/assets/images/plenty-logo.png"
markdown: kramdown

plugins:
  - jekyll-ai-visible-content
  - jekyll-sitemap

author:
  name: "Plenty"
  url: "https://plenty.is/about/"

ai_visible_content:
  enabled: true
  entity:
    type: Organization
    id_slug: plenty
    name: "Plenty"
    description: "Carmine Paolino's software company, making AI products, Ruby frameworks, developer tools, native desktop apps, Linux desktop tools, and DJ software."
    image: "/assets/images/plenty-logo.png"
    location:
      locality: "Berlin"
      country: "DE"
    knows_about:
      - "AI products"
      - "RubyLLM"
      - "Ruby on Rails"
      - "LLM applications"
      - "Developer tools"
      - "Native desktop applications"
      - "Rust"
      - "Linux desktop tools"
      - "DJ software"
      - "AI and Ruby consulting"
      - "Developer workshops"
    same_as:
      - "https://paolino.me"
      - "https://x.com/paolino"
      - "https://www.rubyevents.org/profiles/crmne"
  json_ld:
    auto_inject: true
    include_website_schema: false
    include_breadcrumbs: true
    include_blog_posting: true
    include_faq: true
    include_how_to: true
    article_body: excerpt
    compact: false
  crawlers:
    allow_gptbot: true
    allow_perplexitybot: true
    allow_claudebot: true
    allow_googlebot: true
    allow_bingbot: true
    generate_robots_txt: true
  llms_txt:
    enabled: true
    title: "Plenty"
    description: "Plenty is Carmine Paolino's software company: AI products, Ruby frameworks, developer tools, native desktop apps, Linux desktop tools, and DJ software."
    include_full_text: true
    sections:
      - heading: "What Plenty Does"
        content: "Plenty is a one-person software company run by Carmine Paolino. It makes AI products, Ruby frameworks, developer tools, native desktop apps written in Rust, Linux desktop tools, and DJ software, and offers AI and Ruby consulting, workshops, and talks."
      - heading: "Apps"
        content: |
          - Chat with Work: https://chatwithwork.com
          - Solco (private alpha): https://getsolco.com
          - Spotifast: https://spotifast.rocks
          - ZapFast: https://zapfast.rocks
          - TonePush: https://tonepush.rocks
          - Cluster Headache Tracker: https://clusterheadachetracker.com
      - heading: "Libraries and developer tools"
        content: |
          - RubyLLM: https://rubyllm.com
          - MXC for Ruby: https://crmne.github.io/mxc/
          - devhost: https://github.com/crmne/devhost
          - ArchSpec: https://archspecrb.dev
          - Schematist: https://github.com/crmne/schematist
          - hyprmoncfg: https://hyprmoncfg.dev
          - Kamal Backup: https://kamal-backup.dev
          - Jekyll VitePress: https://jekyll-vitepress.dev
          - native-packages: https://native-packages.dev
          - fastframe: https://fastframe.dev
          - Copilot Triage: https://github.com/marketplace/actions/copilot-triage
      - heading: "Omarchy plugins"
        content: |
          - Calendar for Omarchy: https://github.com/crmne/omarchy-calendar
          - Files for Omarchy: https://github.com/crmne/omarchy-files
          - MOZA for Omarchy: https://github.com/crmne/omarchy-moza
          - OmaStats: https://github.com/crmne/omastats
          - OmaTasks for Todoist: https://github.com/crmne/omatasks
          - Ultimate Guitar Tabs: https://github.com/crmne/omarchy-ultimate-guitar
          - Lyrics Synced with Music: https://github.com/crmne/omarchy-lyrics
          - hyprmoncfg for Omarchy: https://github.com/crmne/omarchy-hyprmoncfg
          - Active Window + Icon: https://github.com/crmne/omarchy-active-window
          - Media Controls + Album Art: https://github.com/crmne/omarchy-mpris
      - heading: "Omarchy tools and themes"
        content: |
          - Omarchy Rescue: https://github.com/crmne/omarchy-rescue
          - Plenty Dark: https://github.com/crmne/omarchy-plenty-dark-theme
          - Plenty Light: https://github.com/crmne/omarchy-plenty-light-theme
          - RubyLLM Dark: https://github.com/crmne/omarchy-ruby-llm-dark-theme
          - RubyLLM Light: https://github.com/crmne/omarchy-ruby-llm-light-theme
          - Chat with Work Dark: https://github.com/crmne/omarchy-chat-with-work-dark-theme
          - Chat with Work Light: https://github.com/crmne/omarchy-chat-with-work-light-theme
          - Solco Dark: https://github.com/crmne/omarchy-solco-dark-theme
          - Solco Light: https://github.com/crmne/omarchy-solco-light-theme
      - heading: "Work with Plenty"
        content: |
          - AI and Ruby consulting: https://paolino.me/work-with-me/
          - RubyLLM Workshops: https://github.com/crmne/ruby_llm-workshop
          - Speaking: https://www.rubyevents.org/profiles/crmne
  linking:
    enable_entity_links: false
    apply_to_metadata: false
    max_links_per_entity_per_post: 1
    enable_related_posts: true
    related_posts_limit: 3
    entity_definitions:
      chat-with-work:
        name: "Chat with Work"
        url: "https://chatwithwork.com"
        description: "Private AI search across your connected work tools."
      rubyllm:
        name: "RubyLLM"
        url: "https://rubyllm.com"
        description: "Ruby tooling for building with large language models."
      archspec:
        name: "ArchSpec"
        url: "https://archspecrb.dev"
        description: "Executable architecture specifications and linting for Ruby and Rails."
      ruby-on-rails:
        name: "Ruby on Rails"
        url: "https://rubyonrails.org"
        description: "The Ruby web framework used across much of Plenty's work."
      llm-applications:
        name: "LLM applications"
        url: "https://rubyllm.com"
        description: "Software products built around large language models."
      developer-workshops:
        name: "Developer workshops"
        url: "https://github.com/crmne/ruby_llm-workshop"
        description: "Hands-on RubyLLM training and workshop material."
      ai-and-ruby-consulting:
        name: "AI and Ruby consulting"
        url: "https://paolino.me/work-with-me/"
        description: "AI and Ruby consulting, RubyLLM workshops, and founder coaching."
      open-source-ruby-tools:
        name: "Open source Ruby tools"
        url: "https://github.com/crmne"
        description: "Open source Ruby projects and developer tooling."
  ai_resources:
    enabled: true
    formats:
      - json
      - yaml
      - markdown
    max_links_per_page: 5
    auto_inject: false
    inject_instruction_block: false
    base_path: "/ai"
  validation:
    warn_name_inconsistency: true
    warn_missing_same_as: true
    warn_missing_dates: true
    warn_orphan_pages: true
    warn_missing_descriptions: true
    fail_build_on_error: false
    exclude_paths:
      - "/imprint/"
      - "imprint.md"
    content_only: true
    verbose: false
    max_examples: 3

exclude:
  - README.md
  - assets/images/projects/README.md

# Sections of the home page, in order. Each shows the projects in
# _data/projects.yml whose `category` matches `category`.
project_groups:
  - category: Apps
    id: apps
    title: Apps
    intro: Products for work, music, and health, on the web and as native desktop apps.
  - category: Libraries & developer tools
    id: tools
    title: Libraries and developer tools
    intro: Open source Ruby frameworks, Rust foundations, and the tools that build, check, and ship software.
  - category: Omarchy plugins
    id: omarchy
    title: Omarchy plugins
    intro: Plugins for the Omarchy Linux desktop, from calendar and file search to system monitoring, music, and racing hardware.
  - category: Omarchy tools & themes
    id: omarchy-tools-themes
    title: Omarchy tools and themes
    intro: A rescue USB for recovering an Omarchy system, plus light and dark desktop themes drawn from Plenty, RubyLLM, Chat with Work, and Solco.
  - category: Work with me
    id: work-with-plenty
    title: Work with Plenty
    intro: Carmine Paolino's time, for founders and teams building with AI and Ruby.
